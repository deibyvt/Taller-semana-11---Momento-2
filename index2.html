<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter VIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-white text-gray-800 font-sans">

  <div class="max-w-xl mx-auto px-4 py-20">

    <h1 class="text-6xl text-center font-bold mb-8">Newsletter VIP</h1>

    <form id="form-registro" class="mb-8">
      <div class="mb-4">
        <label class="block mb-1 text-sm font-medium">Correo electrónico</label>
        <input
          type="text"
          id="input-correo"
          placeholder="ejemplo@correo.com"
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
        >
        <span class="error text-red-500 text-xs mt-1 block"></span>
      </div>

      <div Class="mb-4">
        <label class="block mb-1 text-sm font-medium">Plan</label>
        <select
          id="select-plan"
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          <option value="Gratis">Gratis</option>
          <option value="Premium">Premium</option>
        </select>
      </div>

      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded"> Registrar
      </button>
      </form>

    <div class="flex items-center justify-between mb-3">
      <h2 class="text-2xl font-semibold">Suscriptores registrados</h2>
      <div class="flex gap-2">
        <button id="btn-todos" class="text-sm border border-gray-300 rounded px-3 py-1 hover:bg-gray-100"> Ver todos
        </button>
        <button id="btn-premium" class="text-sm bg-blue-600 hover:bg-blue-700 text-white rounded px-3 py-1"> Ver Premium
        </button>
      </div>
    </div>

    <ul id="lista-subs" class="divide-y divide-gray-200 border border-gray-200 rounded"></ul>
    <p id="estado-vacio" class="text-sm text-gray-400 mt-4 text-center">Sin suscriptores aún.</p>

  </div>

  <script src="newLetter2.js"></script>
    
</body>
</html>
